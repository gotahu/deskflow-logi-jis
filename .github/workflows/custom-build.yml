name: Combined Windows Build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: Install dependencies
        id: deps
        uses: ./.github/actions/install-dependencies
        with:
          qt-version: 6.10.3
          vcpkg-triplet: x64-windows-release
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DSKIP_BUILD_TESTS=ON
          -DPACKAGE_VERSION_LABEL=combined-logi-jis
          ${{ steps.deps.outputs.vcpkg-cmake-config }}
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test synthetic arrow normalization
        run: ctest --test-dir build/src/unittests -R "^MSWindowsSyntheticKeyTests$" --output-on-failure
      - name: Package portable build
        run: cpack --config build/CPackConfig.cmake -G 7Z -B build
      - uses: actions/upload-artifact@v4
        with:
          name: deskflow-combined-windows-x64
          path: build/deskflow-*-portable.7z
          if-no-files-found: error
